name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Just
        uses: extractions/setup-just@v3

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks
        run: just check

      - name: Build wheel and check both packages ship
        run: |
          uv build --wheel -o dist
          python - <<'EOF'
          import glob
          import zipfile

          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          for pkg in ("curator", "text_dedup"):
              for member in ("__init__.py", "py.typed"):
                  assert f"{pkg}/{member}" in names, f"{pkg}/{member} missing from wheel"
          EOF

  tests-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests (unit tests + src doctests)
        run: uv run pytest --cov --cov-config=pyproject.toml --cov-report=xml

      - name: Check typing
        run: uv run mypy

      # Codacy is wired to the upstream repository's secrets; skip it on forks.
      - name: Upload coverage reports to Codacy
        if: ${{ matrix.python-version == '3.12' && github.repository == 'ChenghaoMou/text-dedup' }}
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage.xml
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_ORGANIZATION_PROVIDER: gh
          CODACY_USERNAME: ChenghaoMou
          CODACY_PROJECT_NAME: text-dedup

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build the runtime image
        run: docker build -t datasieve:ci .

      - name: Run the demo pipeline in the image (no network)
        run: docker run --rm --network none datasieve:ci
