[project]
# Fork of text-dedup (https://github.com/ChenghaoMou/text-dedup). The wheel ships
# both the upstream `text_dedup` package and the fork's `curator` package.
name = "sft-data-curator"
version = "0.1.0"
description = "Training-data curation for SFT and preference data, built on text-dedup"
readme = "README.md"
requires-python = ">=3.12,<4.0"
# Upstream author of `text_dedup`; the fork's maintainer is listed separately.
authors = [{ name = "Chenghao Mou", email = "mouchenghao@gmail.com" }]
maintainers = [{ name = "vipul21435" }]
keywords = ["deduplication", "data-curation", "sft", "preference-data", "llm"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "bitarray>=3.7.1",
  "datasets>=4.0.0",
  "ftfy>=6.3.1",
  "numpy>=1.26.0",
  "polars>=1.32.3",
  "polars-grouper>=0.3.0",
  "psutil>=5.9.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.9.1",
  "rbloom>=1.5.2",
  "regex>=2024.11.6",
  "rich>=13.0.0",
  "scipy>=1.13.1",
  "tqdm>=4.66.0",
  "xxhash>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/vipul21435/sft-data-curator"
Repository = "https://github.com/vipul21435/sft-data-curator"
Upstream = "https://github.com/ChenghaoMou/text-dedup"
"Upstream Documentation" = "https://ChenghaoMou.github.io/text-dedup/"

[project.optional-dependencies]
datasets = []
report = ["gradio>=4.44.1", "gradio-rangeslider>=0.0.8", "plotly>=6.1.1"]

[dependency-groups]
dev = [
  "deptry>=0.23.0",
  "gradio>=5.39.0",
  "gradio-rangeslider>=0.0.8",
  "mypy>=0.991",
  "plotly>=6.2.0",
  "pre-commit>=2.20.0",
  "pytest>=7.2.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.11.5",
  "scalene>=1.5.51",
  "scikit-learn>=1.8.0",
  "scipy-stubs>=1.16.1.1",
  "tox-uv>=1.11.3",
  "types-regex>=2024.11.6.20250403",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The distribution name no longer matches a package dir, so list both explicitly.
packages = ["src/text_dedup", "src/curator"]

[tool.bandit]
exclude = ["tests/*"]

[tool.coverage.report]
skip_empty = true
omit = [
  "tests/*",
  "src/text_dedup/config/algorithms/__init__.py",
  "src/text_dedup/config/__init__.py",
  "src/text_dedup/config/io/__init__.py",
  "src/text_dedup/utils/ftfy_utils.py",
  "src/text_dedup/utils/logger.py",
  "src/text_dedup/utils/progress.py",
  "src/text_dedup/utils/timer.py",
  "src/text_dedup/utils/env.py",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.deptry]
extend_exclude = ["benchmarks"]

[tool.deptry.per_rule_ignores]
# Optional dependencies for report module
DEP002 = ["gradio", "gradio-rangeslider", "plotly"]
# scalene is conditionally imported for profiling
DEP004 = ["scalene"]

[tool.mypy]
files = ["src"]
disallow_untyped_defs = true
disallow_any_unimported = false
ignore_missing_imports = true
follow_untyped_imports = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# The fork's own package is held to a stricter bar than the upstream code.
module = ["curator", "curator.*"]
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
strict_equality = true
warn_unreachable = true

[tool.pyright]
reportUnknownMemberType = false
reportMissingTypeStubs = false
reportUnusedCallResult = false

[tool.pytest.ini_options]
# pytest < 9 ignores a bare [tool.pytest] table, so the options must live here.
# Coverage is opt-in (pass --cov explicitly, as CI and `just test` do).
addopts = ["-ra", "--strict-markers", "--doctest-modules"]
testpaths = ["tests", "src"]
# Repo root on sys.path so tests can import the top-level `benchmarks` package.
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true
# third_party/ holds vendored upstream code (the optional suffix-array backend
# submodule). Never lint or rewrite it, not even when a tool such as an editor or
# pre-commit passes one of its files explicitly.
extend-exclude = ["third_party"]
force-exclude = true

[tool.ruff.lint]
select = [
  # flake8-2020
  "YTT",
  # flake8-bandit
  "S",
  # flake8-bugbear
  "B",
  # flake8-builtins
  "A",
  # flake8-comprehensions
  "C4",
  # flake8-debugger
  "T10",
  # flake8-simplify
  "SIM",
  # isort
  "I",
  # mccabe
  "C90",
  # pycodestyle
  "E",
  "W",
  # pyflakes
  "F",
  # pygrep-hooks
  "PGH",
  # pyupgrade
  "UP",
  # ruff
  "RUF",
  # tryceratops
  "TRY",
]
ignore = [
  # LineTooLong
  "E501",
  # DoNotAssignLambda
  "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
preview = true
